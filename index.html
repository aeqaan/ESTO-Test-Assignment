<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminder with a way out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work — a calm cover for a reviewer: what this is, and two doors
   IDEA the home screen of ESTO's customer portal: grey canvas, white cards, pill buttons
   PICTURE two large cards, each mostly a real preview of what's behind it
   COLOUR canvas #e9eaee, white cards, ink #111827, ESTO green #14b56d, focus blue #3300ff
   TYPE Inter 600 for the title (tight tracking, like the portal), Inter 400 for text
   LAYOUT title block over two cards side by side on a laptop; one column on a phone */
:root{color-scheme:light;--bg:#e9eaee;--card:#fff;--ink:#111827;--g100:#f3f4f6;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--green:#14b56d;--brand:#3300ff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
@media (min-width:761px){body::after{content:"";flex:none;height:44px}}
.top{width:100%;max-width:1240px;margin:0 auto;padding:22px max(16px,3vw) 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--g600)}
.top b{color:var(--ink);font-weight:600}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
h1{font-size:clamp(36px,5.4vw,56px);font-weight:600;letter-spacing:-.05em;line-height:1.04;margin:0 0 18px;text-wrap:balance}
.grid{width:100%;max-width:1240px;margin:auto;padding:clamp(24px,3vw,40px) max(16px,3vw);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:20px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s ease}
.card:hover,.card:focus-visible{transform:translateY(-6px);box-shadow:0 22px 44px -16px rgba(17,24,39,.25)}
.card:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.pic{position:relative;aspect-ratio:5/4;overflow:hidden;background:var(--g100)}
.pic img{display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .pic img,.card:focus-visible .pic img{transform:scale(1.03)}
.pic.phone{background:#e9eaee}
.pic.phone img{width:min(62%,330px);height:auto;margin:36px auto 0;filter:drop-shadow(0 14px 22px rgba(17,24,39,.24))}
.pic.doc{background:#e9eaee}
.pic.doc img{width:86%;height:auto;margin:36px auto 0;border-radius:14px 14px 0 0;box-shadow:0 14px 34px -10px rgba(17,24,39,.28)}
.body{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px 20px}
.body h2{font-size:22px;font-weight:600;letter-spacing:-.04em;line-height:1.2;margin:0}
.body p{margin:2px 0 0;color:var(--g600);font-size:15px;line-height:1.45}
.btn{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:100px;background:var(--ink);color:#fff;font-size:15px;font-weight:500;opacity:0;transform:translateX(-6px);transition:opacity .25s ease,transform .3s cubic-bezier(.2,.7,.2,1)}
.card:hover .btn,.card:focus-visible .btn{opacity:1;transform:none}
.card.main .btn{background:var(--green)}
@media (hover:none){.btn{opacity:1;transform:none}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.body{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){.card,.pic img,.btn{transition:none}.card:hover,.card:focus-visible{transform:none}.card:hover .pic img{transform:none}}
</style>
</head>
<body>
<header class="top"><span><b>Yevhenii Chornyi</b> · ESTO Product Builder test assignment</span><span>24 November 2026</span></header>

<h1 class="sr-only">Reminder with a way out</h1>

<main class="grid">
  <a class="card main" href="prototype.html">
    <div class="pic phone"><img src="img/prototype.png" alt="Phone showing the options screen with a payment holiday suggested"></div>
    <div class="body">
      <div><h2>Prototype</h2><p>Reminder email, one-tap pay and the help flow.</p></div>
      <span class="btn">Open →</span>
    </div>
  </a>
  <a class="card" href="write-up.html">
    <div class="pic doc"><img src="img/write-up.png" alt="First page of the write-up with the research board and the reminder timeline"></div>
    <div class="body">
      <div><h2>Write-up</h2><p>Problem, impact, what I left out, launch, AI, business case.</p></div>
      <span class="btn">Read →</span>
    </div>
  </a>
</main>
</body>
</html>
